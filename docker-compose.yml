version: '3.8'

services:
  educore-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: eaglepower-educore
    restart: unless-stopped
    ports:
      - "5050:5050"
    environment:
      - NODE_ENV=production
      - PORT=5050
      - JWT_SECRET=${JWT_SECRET:?Set a unique strong JWT_SECRET before starting production}
    volumes:
      - educore-data:/app/server/data
      - educore-backups:/app/server/backups

volumes:
  educore-data:
  educore-backups:
