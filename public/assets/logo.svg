  <circle cx="250" cy="250" r="226" fill="none" stroke="#F59E0B" stroke-width="2" stroke-dasharray="6,6" />
  <circle cx="250" cy="250" r="220" fill="#0A2540" stroke="#F59E0B" stroke-width="4" />
  
  <!-- Top Curved Text Path -->
  <def>
    <path id="topTextArc" d="M 70 250 A 180 180 0 0 1 430 250" fill="none" />
    <path id="bottomTextArc" d="M 430 250 A 180 180 0 0 1 70 250" fill="none" />
  </def>

  <!-- Banner Shield Base -->
  <path d="M 250 85 L 380 135 V 260 C 380 340 250 415 250 415 C 250 415 120 340 120 260 V 135 L 250 85 Z" fill="#05172C" stroke="#F59E0B" stroke-width="8" />
  <path d="M 250 100 L 365 145 V 255 C 365 325 250 395 250 395 C 250 395 135 325 135 255 V 145 L 250 100 Z" fill="#092347" />

  <!-- Sun Rays & Glow -->
  <circle cx="250" cy="220" r="75" fill="#F59E0B" fill-opacity="0.2" />

  <!-- Soaring Eagle -->
  <path d="M 250 145 C 228 175 160 195 140 178 C 170 215 210 225 235 225 C 240 238 225 260 200 270 C 230 274 250 250 250 240 C 250 250 270 274 300 270 C 275 260 260 238 265 225 C 290 225 330 215 360 178 C 340 195 272 175 250 145 Z" fill="#F59E0B" />
  <circle cx="250" cy="180" r="14" fill="#FCD34D" />
  <polygon points="250,165 254,175 264,175 256,182 259,192 250,185 241,192 244,182 236,175 246,175" fill="#0A2540" />

  <!-- Open Book of Knowledge -->
  <path d="M 170 300 C 205 285 238 292 250 306 C 262 292 295 285 330 300 V 355 C 295 342 262 346 250 365 C 238 346 205 342 170 355 V 300 Z" fill="#FFFFFF" stroke="#0A2540" stroke-width="4" />
  <line x1="250" y1="306" x2="250" y2="365" stroke="#F59E0B" stroke-width="6" />
  
  <!-- Book text lines -->
  <line x1="185" y1="312" x2="235" y2="312" stroke="#94A3B8" stroke-width="3" stroke-linecap="round" />
  <line x1="185" y1="324" x2="235" y2="324" stroke="#94A3B8" stroke-width="3" stroke-linecap="round" />
  <line x1="185" y1="336" x2="225" y2="336" stroke="#94A3B8" stroke-width="3" stroke-linecap="round" />
  
  <line x1="265" y1="312" x2="315" y2="312" stroke="#94A3B8" stroke-width="3" stroke-linecap="round" />
  <line x1="265" y1="324" x2="315" y2="324" stroke="#94A3B8" stroke-width="3" stroke-linecap="round" />
  <line x1="275" y1="336" x2="315" y2="336" stroke="#94A3B8" stroke-width="3" stroke-linecap="round" />

  <!-- Lower Ribbon -->
  <path d="M 150 420 L 250 440 L 350 420 L 330 460 L 250 450 L 170 460 Z" fill="#F59E0B" stroke="#B45309" stroke-width="3" />
  <text x="250" y="440" font-family="Arial, sans-serif" font-weight="900" font-size="14" fill="#0A2540" text-anchor="middle" letter-spacing="2">EXCELLENCE &amp; INTEGRITY</text>
  
  <!-- Top Arch Text -->
  <text font-family="Arial, sans-serif" font-weight="900" font-size="28" fill="#F59E0B" letter-spacing="5">
    <textPath href="#topTextArc" startOffset="50%" text-anchor="middle">EAGLE POWER SCHOOLS</textPath>
  </text>
  
  <!-- Bottom Arch Text -->
  <text font-family="Arial, sans-serif" font-weight="800" font-size="18" fill="#FFFFFF" letter-spacing="4">
