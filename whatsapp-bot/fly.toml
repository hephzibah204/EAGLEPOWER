app = "eaglepower-whatsapp-bot"
primary_region = "lhr"

[build]
  dockerfile = "Dockerfile"

[env]
  AUTH_DIR = "/data/auth_info"
  DB_PATH = "/data/eaglepower.db"
  LOG_LEVEL = "warn"
  PORT = "8080"

[mounts]
  source = "bot_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
